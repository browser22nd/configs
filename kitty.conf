# Minimal kitty.conf for an efficient terminal environment

# --- Fonts ---
font_family     Comic Sans 
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 11.0
disable_ligatures never

# --- Cursor ---
# Solid block cursor for precise navigation
cursor_shape block
cursor_blink_interval 0.5

# --- Scrollback ---
# Generous scrollback buffer for reading extensive compilation logs and traces
scrollback_lines 10000

# --- Mouse & Selection ---
# Streamlined copy/paste mechanics
copy_on_select yes
strip_trailing_spaces always

# --- Window Layout ---
window_padding_width 4
# Removes title bars and borders, optimizing screen real estate for window managers
hide_window_decorations yes
# Disables confirmation when closing windows to maintain a fast workflow
confirm_os_window_close 0

# --- Performance ---
repaint_delay 10
input_delay 3
sync_to_monitor yes

# --- Color Scheme (Neovim Retrobox Dark) ---
background #1c1c1c
foreground #ebdbb2
selection_background #458588
selection_foreground #ebdbb2
url_color #83a598
cursor #ebdbb2
cursor_text_color #1c1c1c

# Normal colors
color0 #1c1c1c
color1 #cc241d
color2 #98971a
color3 #d79921
color4 #458588
color5 #b16286
color6 #689d6a
color7 #a89984

# Bright colors
color8 #928374
color9 #fb4934
color10 #b8bb26
color11 #fabd2f
color12 #83a598
color13 #d3869b
color14 #8ec07c
color15 #ebdbb2
